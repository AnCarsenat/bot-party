# Builds the game for Linux, Windows and macOS.
#  - every push to main: a "nightly" pre-release (replaced each time) + build artifacts
#  - every pushed tag v*  (git tag v0.27 && git push origin v0.27): a release named after the tag
# The export settings are in export_presets.cfg (Project > Export in Godot).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "server/**"
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: write   # to publish releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"   # same as the editor you use
  GODOT_STATUS: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-v1

      - name: Get Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          URL="https://github.com/godotengine/godot-builds/releases/download/$V"
          mkdir -p ~/godot
          curl -fsSL -o godot.zip "$URL/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot && mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot && rm godot.zip
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mkdir -p "$T"
          curl -fsSL -o templates.tpz "$URL/Godot_v${V}_export_templates.tpz"
          # Only what we export (the whole archive is over 1 GB).
          unzip -q -j templates.tpz templates/version.txt templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/windows_release_x86_64_console.exe templates/windows_debug_x86_64_console.exe \
            templates/macos.zip -d "$T"
          rm templates.tpz

      - name: Version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show the build name in the menu (bottom right)
        run: sed -i 's/^const VERSION := .*/const VERSION := "${{ steps.ver.outputs.name }}"/' ui/main_menu.gd

      - name: Import the project
        run: ~/godot/godot --headless --import --path . || true

      - name: Export
        run: |
          mkdir -p export/linux export/windows export/macos dist
          ~/godot/godot --headless --path . --export-release "Linux" export/linux/BotParty.x86_64
          ~/godot/godot --headless --path . --export-release "Windows" export/windows/BotParty.exe
          ~/godot/godot --headless --path . --export-release "macOS" export/macos/BotParty.zip
          N="${{ steps.ver.outputs.name }}"
          cp player/icon.png export/linux/BotParty.png   # for the menu entry (install.sh)
          # Licenses travel with the game (GPL: say where the source is).
          for d in export/linux export/windows; do
            cp LICENSE ASSETS-LICENSE.md CREDITS.md ui/fonts/Jersey-OFL.txt "$d/"
            echo "Bot Party $N. Source code: https://github.com/${{ github.repository }}/tree/${{ github.sha }}" > "$d/SOURCE.txt"
          done
          (cd export/linux && chmod +x BotParty.x86_64 && zip -q -r "../../dist/BotParty-$N-linux.zip" .)
          (cd export/windows && zip -q -r "../../dist/BotParty-$N-windows.zip" .)
          cp export/macos/BotParty.zip "dist/BotParty-$N-macos.zip"
          (cp LICENSE ASSETS-LICENSE.md CREDITS.md ui/fonts/Jersey-OFL.txt export/linux/SOURCE.txt export/macos/ && cd export/macos \
            && zip -q "../../dist/BotParty-$N-macos.zip" LICENSE ASSETS-LICENSE.md CREDITS.md Jersey-OFL.txt SOURCE.txt)
          # The example mod, as a mod pack (goes in the game's mods folder).
          ~/godot/godot --headless --path . --script res://editor/pack_mod.gd -- res://mods/example dist/example.pck
          ls -la dist
          test -s "dist/BotParty-$N-linux.zip" && test -s "dist/BotParty-$N-windows.zip" && test -s "dist/BotParty-$N-macos.zip" && test -s dist/example.pck

      - name: Keep the builds (Actions > this run > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BotParty-${{ steps.ver.outputs.name }}
          path: dist/*
          retention-days: 14

      - name: Nightly release (replaced on every push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (${{ steps.ver.outputs.name }})" \
            --notes "Latest build of main ($GITHUB_SHA). Not tested by hand: for testing, not for keeps."

      - name: Release for the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Bot Party $GITHUB_REF_NAME" --generate-notes
